<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">


    <meta name="theme-color" content="#f2f2f7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Training Diary">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>Дневник тренировок</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

<div id="auth-screen" class="auth-screen">
    <div class="auth-box">
        <div class="auth-box__brand" aria-hidden="true">
            <span class="auth-box__brand-mark">TD</span>
        </div>
        <h3 class="auth-box__title">Вход в Дневник</h3>
        <p class="auth-box__lede" id="auth-lede">Войдите под своей учётной записью.</p>
        <div id="auth-register-extra" class="auth-register-extra" hidden>
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-first-name">Имя</label>
                <input type="text" id="auth-first-name" class="auth-field" placeholder="Иван" autocomplete="given-name">
            </div>
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-last-name">Фамилия</label>
                <input type="text" id="auth-last-name" class="auth-field" placeholder="Иванов" autocomplete="family-name">
            </div>
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-patronymic">Отчество</label>
                <input type="text" id="auth-patronymic" class="auth-field" placeholder="Иванович" autocomplete="additional-name">
            </div>
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-birth-date">Дата рождения</label>
                <input type="date" id="auth-birth-date" class="auth-field" autocomplete="bday">
            </div>
        </div>
        <div class="auth-credentials">
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-email">Email</label>
                <input type="email" id="auth-email" class="auth-field" placeholder="you@example.com" autocomplete="email">
            </div>
            <div class="auth-field-group">
                <label class="auth-field-label" for="auth-password">Пароль</label>
                <input type="password" id="auth-password" class="auth-field" placeholder="••••••••" autocomplete="current-password">
            </div>
        </div>
        <button type="button" id="auth-login-btn" class="btn btn-primary auth-submit-btn">Войти</button>
        <button type="button" id="auth-toggle-btn" class="auth-toggle-btn">Зарегистрироваться</button>
    </div>
</div>

<div id="mode-select-screen">
    <div class="mode-select-box">
        <h3>Выберите режим работы</h3>
        <div class="mode-options">
            <button id="select-own-mode" class="mode-btn">
                <span class="mode-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" aria-hidden="true"><title>Ios Fitness SVG Icon</title><path d="M352 280H160c-4.4 0-8-3.6-8-8v-32c0-4.4 3.6-8 8-8h192c4.4 0 8 3.6 8 8v32c0 4.4-3.6 8-8 8z" fill="currentColor"/><path d="M378 362V150c0-12.1 9.9-22 22-22s22 9.9 22 22v212c0 12.1-9.9 22-22 22s-22-9.9-22-22z" fill="currentColor"/><path d="M460 192h-12c-4.4 0-8 3.6-8 8v112c0 4.4 3.6 8 8 8h12c11 0 20-9 20-20v-88c0-11-9-20-20-20z" fill="currentColor"/><path d="M134 362V150c0-12.1-9.9-22-22-22s-22 9.9-22 22v212c0 12.1 9.9 22 22 22s22-9.9 22-22z" fill="currentColor"/><path d="M64 192H52c-11 0-20 9-20 20v88c0 11 9 20 20 20h12c4.4 0 8-3.6 8-8V200c0-4.4-3.6-8-8-8z" fill="currentColor"/></svg>
                </span>
                <h4>Личные тренировки</h4>

            </button>

            <button id="select-personal-mode" class="mode-btn">
                <span class="mode-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><title>Sharp People Outline SVG Icon</title><path fill="currentColor" d="M9 12c1.93 0 3.5-1.57 3.5-3.5S10.93 5 9 5S5.5 6.57 5.5 8.5S7.07 12 9 12m0-5c.83 0 1.5.67 1.5 1.5S9.83 10 9 10s-1.5-.67-1.5-1.5S8.17 7 9 7m0 6.75c-2.34 0-7 1.17-7 3.5V19h14v-1.75c0-2.33-4.66-3.5-7-3.5M4.34 17c.84-.58 2.87-1.25 4.66-1.25s3.82.67 4.66 1.25zm11.7-3.19c1.16.84 1.96 1.96 1.96 3.44V19h4v-1.75c0-2.02-3.5-3.17-5.96-3.44M15 12c1.93 0 3.5-1.57 3.5-3.5S16.93 5 15 5c-.54 0-1.04.13-1.5.35c.63.89 1 1.98 1 3.15s-.37 2.26-1 3.15c.46.22.96.35 1.5.35"/></svg>
                </span>
                <h4>Персональный тренинг</h4>

            </button>
        </div>
        <button id="mode-logout-btn" class="btn back-btn logout-btn">выход</button>
    </div>
</div>
<div id="top-bar"></div>
<div class="container">

    <div id="root"></div>

</div>

<div id="loading-screen">
    <div class="loader-icon"></div>
</div>


<script>
    (async function lockOrientationWithFallback() {
      // 1) Нативный лок там, где он есть (Android/Chrome и часть десктопов)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('portrait');
        }
      } catch (e) {
        // тихо игнорируем — iOS сюда обычно попадает
      }

      // 2) Фолбэк для iOS: показываем оверлей в альбомной ориентации
      const overlayId = 'rotate-overlay';
      let overlay = document.getElementById(overlayId);
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = overlayId;
        overlay.innerHTML = `
          <div class="rotate-box">
            <div class="rotate-icon">📱↩️</div>
            <div class="rotate-text">Пожалуйста, поверните устройство вертикально</div>
          </div>
        `;
        document.body.appendChild(overlay);
      }

      function setScrollLocked(locked) {
        // Блокируем «протягивание» и скрол под оверлеем
        document.documentElement.style.overflow = locked ? 'hidden' : '';
        document.body.style.overscrollBehavior = locked ? 'none' : '';
        document.body.style.touchAction = locked ? 'none' : '';
      }

      function updateOverlay() {
        const isLandscape = window.matchMedia('(orientation: landscape)').matches;
        overlay.style.display = isLandscape ? 'flex' : 'none';
        setScrollLocked(isLandscape);
      }

      // Первичная установка и слушатели
      updateOverlay();
      window.addEventListener('orientationchange', updateOverlay);
      window.addEventListener('resize', updateOverlay);
    })();



</script>
<script type="module" src="./script.js"></script>

</body>
</html>
