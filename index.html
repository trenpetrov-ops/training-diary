        <script>
            document.addEventListener('DOMContentLoaded', () => {
              const btn  = document.getElementById('programs-btn');
              const icon = btn.querySelector('#icon'); // общий триггер для bell + dots

              function playOnce() {
                // снять/вернуть класс, чтобы анимации запускались каждый раз
                icon.classList.remove('play');
                // форс-рефлоу — гарантирует перезапуск даже при повторном выборе
                void icon.offsetWidth;
                icon.classList.add('play');

                // убрать класс по завершении (через 2с), чтобы при возврате работало снова
                setTimeout(() => icon.classList.remove('play'), 2000);
              }

              // 1) клик по пункту — анимация 1 раз
              btn.addEventListener('click', playOnce);

              // 2) если твой роутер/меню помечает активный пункт классом "active"
              //    — анимация при установке класса (возвращение на пункт)
              const mo = new MutationObserver(muts => {
                for (const m of muts) {
                  if (m.attributeName === 'class' || m.attributeName === 'aria-selected' || m.attributeName === 'aria-current') {
                    const isActive =
                      btn.classList.contains('active') ||
                      btn.getAttribute('aria-selected') === 'true' ||
                      btn.getAttribute('aria-current') === 'page';
                    if (isActive) playOnce();
                  }
                }
              });
              mo.observe(btn, { attributes: true });

              // 3) если пункт скрывают/показывают (SPA), проигрываем при появлении, если он активен
              const io = new IntersectionObserver(entries => {
                entries.forEach(e => {
                  if (e.isIntersecting) {
                    const isActive =
                      btn.classList.contains('active') ||
                      btn.getAttribute('aria-selected') === 'true' ||
                      btn.getAttribute('aria-current') === 'page';
                    if (isActive) playOnce();
                  }
                });
              });
              io.observe(btn);
            });
        </script>

<script>
    (async function lockOrientationWithFallback() {
      // 1) Нативный лок там, где он есть (Android/Chrome и часть десктопов)
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('portrait');
        }
      } catch (e) {
        // тихо игнорируем — iOS сюда обычно попадает
      }

      // 2) Фолбэк для iOS: показываем оверлей в альбомной ориентации
      const overlayId = 'rotate-overlay';
      let overlay = document.getElementById(overlayId);
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = overlayId;
        overlay.innerHTML = `
          <div class="rotate-box">
            <div class="rotate-icon">📱↩️</div>
            <div class="rotate-text">Пожалуйста, поверните устройство вертикально</div>
          </div>
        `;
        document.body.appendChild(overlay);
      }

      function setScrollLocked(locked) {
        // Блокируем «протягивание» и скрол под оверлеем
        document.documentElement.style.overflow = locked ? 'hidden' : '';
        document.body.style.overscrollBehavior = locked ? 'none' : '';
        document.body.style.touchAction = locked ? 'none' : '';
      }

      function updateOverlay() {
        const isLandscape = window.matchMedia('(orientation: landscape)').matches;
        overlay.style.display = isLandscape ? 'flex' : 'none';
        setScrollLocked(isLandscape);
      }

      // Первичная установка и слушатели
      updateOverlay();
      window.addEventListener('orientationchange', updateOverlay);
      window.addEventListener('resize', updateOverlay);
    })();



</script>
