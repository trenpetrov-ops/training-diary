name: Build iOS (Capacitor)

on:
  workflow_dispatch:

jobs:
  build-ios:
    name: Build unsigned IPA for iOS
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add iOS platform if missing
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          else
            echo "iOS platform already exists"
          fi

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Configure generated iOS project
        run: npm run cap:ios:configure

      - name: Build iOS archive (no signing)
        run: |
          cd ios
          xcodebuild -workspace App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ../build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO archive

      - name: Package unsigned IPA
        run: |
          cd ios
          mkdir -p ../build/ipa/Payload
          APP_PATH=$(find ../build/App.xcarchive -type d -name "*.app" | head -n 1)

          if [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" ../build/ipa/Payload/
            cd ../build/ipa
            zip -r training-diary-ios.ipa Payload
            echo "IPA packaged successfully"
          else
            echo ".app not found inside archive"
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: training-diary-ios
          path: build/ipa/training-diary-ios.ipa
